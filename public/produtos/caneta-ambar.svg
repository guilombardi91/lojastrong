      <stop offset="0" stop-color="#d28e1c"/>
      <stop offset="0.3" stop-color="#ffd664"/>
      <stop offset="0.62" stop-color="#fab644"/>
      <stop offset="1" stop-color="#d28e1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b96a3"/>
      <stop offset="0.35" stop-color="#e8edf2"/>
      <stop offset="0.7" stop-color="#aab4c0"/>
      <stop offset="1" stop-color="#6e7884"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-18 400 400)">
    <!-- ponta -->
    <path d="M372 636 l28 74 28 -74 z" fill="#4c5763"/>
    <path d="M394 692 l6 18 6 -18 z" fill="#031c33"/>
    <!-- cone -->
